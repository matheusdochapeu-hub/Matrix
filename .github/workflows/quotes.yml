name: Cotacoes B3

# Gera data/quotes.json com o fechamento do dia anterior e o ultimo preco de cada acao
# da carteira. Roda depois do fechamento da B3 (18:40 de Brasilia) em dias uteis.
on:
  schedule:
    - cron: '40 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar cotacoes
        run: node scripts/fetch-quotes.mjs
        env:
          MATRIX_TOKEN: MatrixReloaded2026!

      - name: Commitar data/quotes.json
        run: |
          if git diff --quiet -- data/quotes.json; then
            echo "Sem mudanca nas cotacoes."
            exit 0
          fi
          git config user.name "matrix-quotes-bot"
          git config user.email "matrix-quotes-bot@users.noreply.github.com"
          git add data/quotes.json
          git commit -m "chore(cotacoes): atualiza data/quotes.json [skip ci]"
          git push
