name: Cotacoes B3

# Gera data/quotes.json (fechamento do dia anterior + ultimo preco) a cada 10 minutos
# durante o pregao e publica na branch `quotes`. O app le esse arquivo pelo raw.githubusercontent
# (CORS liberado) e mostra a idade da cotacao.
on:
  schedule:
    # 11:00–21:59 UTC = 08:00–18:59 de Brasilia, segunda a sexta
    - cron: '*/10 11-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar cotacoes
        run: node scripts/fetch-quotes.mjs
        env:
          MATRIX_TOKEN: MatrixReloaded2026!
          QUOTES_ALWAYS_WRITE: '1'

      - name: Publicar na branch quotes
        run: |
          set -e
          git config user.name "matrix-quotes-bot"
          git config user.email "matrix-quotes-bot@users.noreply.github.com"
          git checkout --orphan quotes-publish
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f data/quotes.json
          git commit -m "cotacoes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:quotes
